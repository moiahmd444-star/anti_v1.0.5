name: Mobile App Build

on:
  push:
    branches: [ "main" ]
    paths: [ "deel_wallet_app/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "deel_wallet_app/**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deel_wallet_app

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('deel_wallet_app/android/**/*.gradle*', 'deel_wallet_app/android/gradle/wrapper/gradle-wrapper.properties', 'deel_wallet_app/pubspec.lock') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Flutter version
      run: flutter --version

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Tests
      run: flutter test

    - name: Build Release APK
      run: |
        for i in 1 2 3; do
          flutter build apk --release && exit 0
          echo "Build echoue (tentative $i/3), nouvelle tentative dans $((i*30))s"
          sleep $((i*30))
        done
        exit 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BAOU-Finance-Mobile.apk
        path: deel_wallet_app/build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error
        # ponytail: 53 Mo par build ; 3 jours suffisent pour telecharger
        # l'APK. Au-dela, le quota de stockage GitHub sature et l'upload echoue.
        retention-days: 3
